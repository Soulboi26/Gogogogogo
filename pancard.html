<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium PAN Card Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

:root{
  --bg1:#1e1b4b;
  --bg2:#4c1d95;
  --bg3:#0f172a;
  --bg4:#020617;
  --wave1:#ec4899;
  --wave2:#a855f7;
  --header-bg: rgba(2,6,23,0.7);
  --header-text: white;
}

body{
  height:100vh;
  overflow:hidden;
  color:white;
  background:linear-gradient(-45deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));
  background-size:400% 400%;
  animation:gradientMove 12s ease infinite;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* HEADER */
.page-header{
  position:fixed;
  top:0;
  width:100%;
  padding:12px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--header-bg);
  backdrop-filter:blur(12px);
  z-index:1000;
}

.header-center nav{display:flex;gap:25px;}

.header-center nav a{
  color:var(--header-text);
  text-decoration:none;
  font-weight:bold;
  position:relative;
}

.header-center nav a::after{
  content:'';
  position:absolute;
  bottom:-3px;
  width:0;
  height:2px;
  background:#ec4899;
  transition:0.3s;
}
.header-center nav a:hover::after{width:100%;}
.header-center nav a.active{color:#ec4899;}

.header-right{display:flex;gap:10px;position:relative;}

.selected{
  padding:6px 10px;
  border-radius:12px;
  cursor:pointer;
  background:rgba(255,255,255,0.08);
}

.options{
  position:absolute;
  top:40px;
  background:rgba(15,23,42,0.95);
  border-radius:10px;
  max-height:0;
  opacity:0;
  overflow:hidden;
  transition:0.3s;
}
.options.show{max-height:200px;opacity:1;}
.options div{padding:8px;cursor:pointer;}
.options div:hover{background:rgba(255,255,255,0.15);}

/* WAVES */
.wave,.wave2{
  position:absolute;
  bottom:-20px;
  width:100%;
  z-index:0;
}
.wave2{bottom:-40px;opacity:0.8;}
.wave path{filter:blur(8px);}

/* FORM */
.form-page{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.form-box{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(25px);
  padding:25px;
  border-radius:20px;
  width:320px;
}

input,select{
  width:100%;
  margin:8px 0;
  padding:10px;
  border-radius:8px;
  border:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:linear-gradient(45deg,#ec4899,#a855f7);
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

/* CARD */
.card-page{
  position:relative;
  z-index:2;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card-container{
  width:480px;
  height:260px;
  perspective:1200px;
}

.card-inner{
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transition:transform 0.6s;
}

.card-container.flip .card-inner{
  transform:rotateY(180deg);
}

.card{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:14px;
  padding:15px;
  backface-visibility:hidden;
}

.front{
  background:linear-gradient(135deg,#e0f2fe,#bae6fd);
  color:#0c4a6e;
}

.back{
  background:#e0f2fe;
  transform:rotateY(180deg);
}

.header{display:flex;align-items:center;}
.logo{width:40px;}
.title{flex:1;text-align:center;font-size:12px;font-weight:bold;}

.main{display:flex;margin-top:10px;}
.photo img{width:90px;height:110px;border-radius:6px;}
.details{margin-left:12px;font-size:13px;}
.pan{font-size:18px;font-weight:bold;margin-top:6px;}

#qrcode{position:absolute;right:15px;top:75px;}

.flip-btn{margin-top:20px;width:200px;}

.glare{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:0;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="page-header">
  <h2>PAN CARD GENERATOR</h2>

  <div class="header-center">
    <nav>
      <a href="#" class="active">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </div>

  <div class="header-right">

    <!-- LANGUAGE -->
    <div>
      <div class="selected" onclick="toggleDropdown('lang')">English</div>
      <div class="options" id="lang">
        <div onclick="selectOption(this,'lang','lang')">English</div>
        <div onclick="selectOption(this,'lang','lang')">Hindi</div>
        <div onclick="selectOption(this,'lang','lang')">Marathi</div>
        <div onclick="selectOption(this,'lang','lang')">Japanese</div>
      </div>
    </div>

    <!-- THEME -->
    <div>
      <div class="selected" onclick="toggleDropdown('theme')">Theme</div>
      <div class="options" id="theme">
        <div onclick="selectTheme('dark')">Dark</div>
        <div onclick="selectTheme('ocean')">Ocean</div>
        <div onclick="selectTheme('sunset')">Sunset</div>
        <div onclick="selectTheme('neon')">Neon</div>
      </div>
    </div>

  </div>
</header>

<!-- WAVES -->
<svg class="wave" viewBox="0 0 1440 320">
<path fill="var(--wave1)" fill-opacity="0.35">
<animate attributeName="d" dur="12s" repeatCount="indefinite"
values="M0,160L60,186C120,210,240,260,360,250C480,240,600,180,720,170C840,160,960,190,1080,200C1200,210,1320,200,1440,190L1440,320L0,320Z;
M0,200L60,180C120,160,240,120,360,130C480,140,600,180,720,210C840,240,960,240,1080,210C1200,180,1320,120,1440,90L1440,320L0,320Z;
M0,160L60,186C120,210,240,260,360,250C480,240,600,180,720,170C840,160,960,190,1080,200C1200,210,1320,200,1440,190L1440,320L0,320Z">
</animate>
</path>
</svg>

<!-- FORM -->
<div class="form-page" id="formPage">
<div class="form-box">
<h3>PAN Card Form</h3>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="father" placeholder="Father Name">
<input type="date" id="dob">
<select id="gender"><option>Male</option><option>Female</option></select>
<input type="file" id="photo">

<button onclick="generateCard()">Generate PAN</button>
</div>
</div>

<!-- CARD -->
<div class="card-page" id="cardPage">
<div class="card-container" id="cardContainer">
<div class="card-inner">

<div class="card front">
<div class="glare" id="glare"></div>

<div class="header">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" class="logo">
<div class="title">INCOME TAX DEPARTMENT</div>
</div>

<div class="main">
<div class="photo"><img id="cardPhoto"></div>

<div class="details">
<div id="cardName"></div>
Father: <span id="cardFather"></span><br>
DOB: <span id="cardDob"></span><br>
Gender: <span id="cardGender"></span>

<div class="pan" id="cardPan"></div>
</div>
</div>

<div id="qrcode"></div>
</div>

<div class="card back">Back Side</div>

</div>
</div>

<button class="flip-btn" onclick="flipCard()">Flip Card</button>
</div>

<script>
const translations={
english:{title:"PAN Card Form",name:"Full Name",father:"Father Name",btn:"Generate PAN"},
hindi:{title:"पैन कार्ड फॉर्म",name:"पूरा नाम",father:"पिता का नाम",btn:"पैन बनाएं"},
marathi:{title:"पॅन कार्ड फॉर्म",name:"पूर्ण नाव",father:"वडिलांचे नाव",btn:"पॅन तयार करा"},
japanese:{title:"PANカードフォーム",name:"氏名",father:"父の名前",btn:"生成"}
};

function setLanguage(lang){
let t=translations[lang];
document.querySelector("h3").innerText=t.title;
document.getElementById("name").placeholder=t.name;
document.getElementById("father").placeholder=t.father;
document.querySelector("button").innerText=t.btn;
}

function toggleDropdown(id){
document.querySelectorAll(".options").forEach(x=>x.classList.remove("show"));
document.getElementById(id).classList.toggle("show");
}

function selectOption(el,id,type){
el.parentElement.previousElementSibling.innerText=el.innerText;
document.getElementById(id).classList.remove("show");

if(type==="lang"){
setLanguage(el.innerText.toLowerCase());
}
}

function selectTheme(theme){
if(theme==="dark"){
document.documentElement.style.setProperty('--bg1','#1e1b4b');
document.documentElement.style.setProperty('--bg2','#4c1d95');
document.documentElement.style.setProperty('--bg3','#0f172a');
document.documentElement.style.setProperty('--bg4','#020617');
}
if(theme==="ocean"){
document.documentElement.style.setProperty('--bg1','#03045e');
document.documentElement.style.setProperty('--bg2','#0077b6');
document.documentElement.style.setProperty('--bg3','#00b4d8');
document.documentElement.style.setProperty('--bg4','#90e0ef');
}
if(theme==="sunset"){
document.documentElement.style.setProperty('--bg1','#ff5e62');
document.documentElement.style.setProperty('--bg2','#ff9966');
document.documentElement.style.setProperty('--bg3','#ff6a00');
document.documentElement.style.setProperty('--bg4','#ee0979');
}
if(theme==="neon"){
document.documentElement.style.setProperty('--bg1','#00f5a0');
document.documentElement.style.setProperty('--bg2','#00d9f5');
document.documentElement.style.setProperty('--bg3','#3a0ca3');
document.documentElement.style.setProperty('--bg4','#7209b7');
}
}

function randomPAN(name){
let letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let pan="";
for(let i=0;i<3;i++) pan+=letters[Math.random()*26|0];
pan+="P"+name[0].toUpperCase();
for(let i=0;i<4;i++) pan+=Math.random()*10|0;
pan+=letters[Math.random()*26|0];
return pan;
}

function generateCard(){
let name=document.getElementById("name").value.trim();
let father=document.getElementById("father").value.trim();
let dob=document.getElementById("dob").value;

if(!name||!father||!dob){alert("Fill all details");return;}

document.getElementById("formPage").style.display="none";
document.getElementById("cardPage").style.display="flex";

document.getElementById("cardName").innerText=name;
document.getElementById("cardFather").innerText=father;
document.getElementById("cardDob").innerText=dob;
document.getElementById("cardGender").innerText=document.getElementById("gender").value;
document.getElementById("cardPan").innerText=randomPAN(name);

new QRCode(document.getElementById("qrcode"),{text:name,width:70,height:70});

let file=document.getElementById("photo").files[0];
if(file){
let reader=new FileReader();
reader.onload=e=>document.getElementById("cardPhoto").src=e.target.result;
reader.readAsDataURL(file);
}
}

function flipCard(){
document.getElementById("cardContainer").classList.toggle("flip");
}
</script>

</body>
</html>
