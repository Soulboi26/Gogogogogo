<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Travel ID Generator PRO</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

/* ===== VARIABLES ===== */
:root{
 --bg-gradient: linear-gradient(-45deg,#1e1b4b,#4c1d95,#0f172a,#020617);
 --container-bg: rgba(255,255,255,0.08);
 --text-color: white;
 --button-bg: linear-gradient(45deg,#ec4899,#a855f7);
 --header-bg: rgba(0,0,0,0.25);
 --header-text: white;
 --wave1:#ec4899;
 --wave2:#a855f7;
 --header-accent:#ec4899;
}

/* ===== GLOBAL ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
 min-height:100vh;
 background: var(--bg-gradient);
 background-size:400% 400%;
 animation: gradientMove 25s ease infinite;
 color: var(--text-color);
 padding-top:70px;
 display:flex;
 flex-direction:column;
 align-items:center;
 overflow-x:hidden;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* ===== HEADER ===== */
.page-header{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 padding:10px 40px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 background: var(--header-bg);
 backdrop-filter:blur(12px);
 border-bottom:1px solid rgba(255,255,255,0.15);
 z-index:1000;
}

.header-center nav{display:flex;gap:25px;}
.header-center nav a{
 color:var(--header-text);
 text-decoration:none;
 font-weight:bold;
}

/* PROFILE */
.profile{
 display:flex;
 align-items:center;
 gap:6px;
 padding:5px 10px;
 border-radius:12px;
 background:rgba(255,255,255,0.08);
 cursor:pointer;
}
.profile-img{width:24px;height:24px;border-radius:50%;}

/* DROPDOWN */
.selected{
 display:flex;
 gap:6px;
 padding:5px 10px;
 border-radius:12px;
 cursor:pointer;
 background:rgba(255,255,255,0.08);
}
.options{
 position:absolute;
 background:#111;
 border-radius:10px;
 max-height:0;
 overflow:hidden;
 opacity:0;
 transition:0.3s;
}
.options.show{max-height:200px;opacity:1;}
.options div{padding:6px;cursor:pointer;}
.options div:hover{background:#333;}

/* WAVES */
.wave{position:absolute;bottom:-20px;width:100%;}
.wave2{bottom:-40px;opacity:0.8;}

/* CONTAINER */
.container{
 width:600px;
 max-width:90%;
 padding:30px;
 border-radius:20px;
 background: var(--container-bg);
 text-align:center;
 margin-top:40px;
}

input{
 width:100%;
 margin:8px 0;
 padding:10px;
 border:none;
 border-radius:6px;
}

button{
 width:100%;
 padding:12px;
 border-radius:10px;
 border:none;
 cursor:pointer;
 margin-top:10px;
 background: var(--button-bg);
 color:var(--text-color);
}

/* CARD */
.card-page{display:none;justify-content:center;margin-top:20px;}
.id-card{
 width:520px;height:300px;
 background:#f5f0e6;
 color:#111;
 padding:15px;
 border-radius:12px;
 position:relative;
}
.id-card::before{
 content:"SAMPLE";
 position:absolute;
 font-size:80px;
 opacity:0.05;
 transform:rotate(-30deg);
 top:80px;left:80px;
}

</style>
</head>

<body>

<!-- HEADER -->
<header class="page-header">

<div>Fake Details Generator</div>

<div class="header-center">
<nav>
<a href="home.html">Home</a>
<a href="#">About</a>
</nav>
</div>

<div style="display:flex;gap:10px;position:relative;">

<div class="profile">
<img src="https://i.pravatar.cc/24" class="profile-img">
<span>Saurabh</span>
</div>

<div>
<div class="selected" onclick="toggleDropdown('lang')">🌐 English</div>
<div class="options" id="langOptions">
<div>English</div>
<div>Hindi</div>
</div>
</div>

<div>
<div class="selected" onclick="toggleDropdown('theme')" id="themeText">🌑 Dark</div>
<div class="options" id="themeOptions"></div>
</div>

</div>

</header>

<!-- WAVES -->
<svg class="wave" viewBox="0 0 1440 320">
<path fill="var(--wave1)" fill-opacity="0.35"></path>
</svg>

<svg class="wave wave2" viewBox="0 0 1440 320">
<path fill="var(--wave2)" fill-opacity="0.25"></path>
</svg>

<!-- GENERATOR -->
<div class="container">

<h2>✈️ Travel ID Generator</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="country" placeholder="Nationality">
<input type="date" id="dob">
<input type="text" id="passport" placeholder="ID Number">
<input type="file" id="photo">

<button onclick="generateCard()">Generate ID</button>

</div>

<!-- CARD -->
<div class="card-page" id="cardPage">
<div class="id-card">
<div id="cardName"></div>
<div id="cardCountry"></div>
<div id="cardDob"></div>
<div id="cardPass"></div>
<img id="cardPhoto" width="100">
</div>
</div>

<script>

/* DROPDOWN */
function toggleDropdown(type){
 document.getElementById(type+"Options").classList.toggle("show");
}

/* ===== THEME SYSTEM ===== */
const themes=[
{name:"Dark",icon:"🌑",colors:["#1e1b4b","#4c1d95","#0f172a","#020617"],container:"rgba(255,255,255,0.08)",text:"white",button:"linear-gradient(45deg,#ec4899,#a855f7)",header:"rgba(0,0,0,0.25)",headerText:"white",wave1:"#ec4899",wave2:"#a855f7",accent:"#ec4899"},
{name:"Light",icon:"☀️",colors:["#fefcea","#f1da36","#fff7e6","#fff3c4"],container:"rgba(0,0,0,0.08)",text:"#111",button:"linear-gradient(45deg,#f1da36,#fefcea)",header:"rgba(255,255,255,0.2)",headerText:"#111",wave1:"#f1da36",wave2:"#fefcea",accent:"#f1da36"},
{name:"Sunset",icon:"🌇",colors:["#ff9a9e","#fad0c4","#ffb347","#ffcc70"],container:"rgba(0,0,0,0.15)",text:"#111",button:"linear-gradient(45deg,#ff9a9e,#ffb347)",header:"rgba(0,0,0,0.15)",headerText:"#111",wave1:"#ff9a9e",wave2:"#ffb347",accent:"#ff9a9e"},
{name:"Ocean",icon:"🌊",colors:["#00c6ff","#0072ff","#00f2fe","#009ffd"],container:"rgba(255,255,255,0.15)",text:"#fff",button:"linear-gradient(45deg,#00c6ff,#0072ff)",header:"rgba(0,0,0,0.25)",headerText:"white",wave1:"#00c6ff",wave2:"#0072ff",accent:"#00c6ff"},
{name:"Forest",icon:"🌲",colors:["#134E5E","#71B280","#1f4037","#99A799"],container:"rgba(255,255,255,0.15)",text:"#fff",button:"linear-gradient(45deg,#134E5E,#71B280)",header:"rgba(0,0,0,0.25)",headerText:"white",wave1:"#134E5E",wave2:"#71B280",accent:"#134E5E"}
];

let currentTheme=0;

function setTheme(index){
 const t=themes[index];

 document.documentElement.style.setProperty('--bg-gradient', `linear-gradient(-45deg,${t.colors.join(",")})`);
 document.documentElement.style.setProperty('--container-bg', t.container);
 document.documentElement.style.setProperty('--text-color', t.text);
 document.documentElement.style.setProperty('--button-bg', t.button);
 document.documentElement.style.setProperty('--header-bg', t.header);
 document.documentElement.style.setProperty('--header-text', t.headerText);
 document.documentElement.style.setProperty('--wave1', t.wave1);
 document.documentElement.style.setProperty('--wave2', t.wave2);
 document.documentElement.style.setProperty('--header-accent', t.accent);

 document.getElementById("themeText").innerText = t.icon+" "+t.name;

 renderThemeOptions();
 currentTheme=index;
}

function renderThemeOptions(){
 const container=document.getElementById('themeOptions');
 container.innerHTML="";

 themes.forEach((t,i)=>{
   if(i!==currentTheme){
     const div=document.createElement("div");
     div.innerText=t.icon+" "+t.name;
     div.onclick=()=>{
       setTheme(i);
       container.classList.remove("show");
     };
     container.appendChild(div);
   }
 });
}

/* INIT */
window.onload=function(){
 setTheme(0);
}

/* GENERATOR */
function generateCard(){
 let name=document.getElementById("name").value;
 let country=document.getElementById("country").value;
 let dob=document.getElementById("dob").value;
 let pass=document.getElementById("passport").value;
 let photo=document.getElementById("photo").files[0];

 if(!name || !dob || !pass){ alert("Fill all"); return;}

 document.getElementById("cardPage").style.display="flex";

 cardName.innerText=name.toUpperCase();
 cardCountry.innerText=(country||"INDIAN").toUpperCase();
 cardDob.innerText=new Date(dob).toLocaleDateString('en-GB');
 cardPass.innerText="ID: "+pass;

 if(photo){
 let reader=new FileReader();
 reader.onload=e=>cardPhoto.src=e.target.result;
 reader.readAsDataURL(photo);
 }
}

</script>

</body>
</html>
