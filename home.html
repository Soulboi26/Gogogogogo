<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home Page with Themes & App Animation</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
/* ===== GLOBAL ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{height:100vh;background:linear-gradient(-45deg,#1e1b4b,#4c1d95,#0f172a,#020617);background-size:400% 400%;animation:gradientMove 25s ease infinite;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;}
@keyframes gradientMove{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
body {
    min-height: 100vh;
    background: var(--bg-gradient); /* changed from hardcoded gradient */
    background-size: 400% 400%;
    animation: gradientMove 25s ease infinite;
    color: var(--text-color);
    transition: background 0.8s ease, color 0.8s ease;
    padding-top: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    overflow-x: hidden;
}
/* ===== HEADER ===== */
.page-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 10px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--header-bg);
  color: var(--header-text);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.15);
  z-index: 1000;
  transition: background 0.5s ease, color 0.5s ease;
}
.header-left h1 { font-size: 20px; color: var(--header-text); }
.header-center nav { display:flex; gap:25px; }
.header-center nav a {
  color: var(--header-text);
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
  position: relative;
  padding:5px 0;
  transition: color 0.3s;
}
.header-center nav a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -3px;
  width: 0;
  height: 2px;
  background: var(--header-accent);
  transition: width 0.3s ease;
}
.header-center nav a:hover::after { width: 100%; }
.header-center nav a.active { color: var(--header-accent); }
.header-center nav a.active::after { width: 100%; }
.header-right { display:flex; gap:10px; align-items:center; }

/* ===== PROFILE ===== */
.profile {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 12px;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    color: var(--header-text);
    font-weight: bold;
    transition: background 0.3s;
    border: 1px solid rgba(255,255,255,0.15);
}
.profile:hover { background: rgba(255,255,255,0.18); }
.profile-img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }
.profile-name { font-size: 13px; }

/* ===== SELECTORS ===== */
.selected{
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.08);
  color: var(--header-text);
  padding:5px 10px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.15);
  transition:0.3s;
  font-size: 13px;
}
.selected:hover{ background: rgba(255,255,255,0.18); }
.options{
  margin-top:5px;
  background:rgba(15,23,42,0.95);
  border-radius:10px;
  overflow:hidden;
  max-height:0;
  opacity:0;
  transition:0.3s ease;
  position:absolute;
  width:100%;
  z-index:9999;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}
.options.show{ max-height:250px; opacity:1; }
.options div{
  padding:6px 10px;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  color:var(--header-text);
  transition:0.3s;
  font-size: 13px;
}
.options div:hover{ background:rgba(255,255,255,0.15); border-radius:8px; }
.lang-select img, .theme-select img{width:18px;}

/* ===== WAVES ===== */
.wave{position:absolute;bottom:-20px;left:0;width:100%;z-index:0;will-change:transform;}
.wave2{bottom:-40px;opacity:0.8;}
.wave path{filter: blur(6px);}

/* ===== CONTAINER ===== */
.container{
  width:600px;
  max-width:90%;
  padding:45px;
  border-radius:30px;
  background: var(--container-bg);
  backdrop-filter:blur(50px);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 30px 100px rgba(0,0,0,0.9);
  color: var(--text-color);
  text-align:center;
  animation:fadeIn 1s ease;
  transition: background 0.8s ease, color 0.8s ease;
}
h2{ font-size:34px; margin-bottom:15px; transition: color 0.8s ease; }
p{ margin-bottom:30px; font-size:16px; transition: color 0.8s ease; }
button{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  transition: transform 0.3s, background 0.5s, color 0.5s;
  font-size:15px;
  color: var(--text-color);
  background: var(--button-bg);
  margin-bottom: 10px;
}
button:hover{ transform:scale(1.05); box-shadow:0 0 20px rgba(168,85,247,0.6); }
button:active{transform:scale(0.98);}

/* FOOTER */
.page-footer{ margin-top:50px; text-align:center; font-size:13px; color: var(--text-color); }

@keyframes fadeIn{
  from{opacity:0; transform:translateY(30px) scale(0.95);}
  to{opacity:1; transform:translateY(0) scale(1);}
}

@media(max-width:700px){
  .container{width:90%; padding:35px;}
  h2{font-size:28px;} p{font-size:14px;}
  .page-header {padding:8px 20px;}
  .header-left h1 {font-size:18px;}
  .header-center nav a{font-size:12px;}
}

/* ===== LOADING ANIMATION ===== */
#loadingScreen{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.8);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2000;
  display:none;
}
.loader{
  border: 6px solid rgba(255,255,255,0.2);
  border-top: 6px solid #ec4899;
  border-radius:50%;
  width:60px; height:60px;
  animation: spin 1s linear infinite;
}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- Header -->
<header class="page-header">
  <div class="header-left"><h1>Details Generator</h1></div>
  <div class="header-center">
    <nav>
      <a href="#" class="active">Home</a>
      <a href="abouttttt.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
  <div class="header-right">
    <!-- PROFILE -->
    <div class="profile" onclick="goToLogin()">
      <img id="profileImg" class="profile-img" src="https://i.pravatar.cc/24" alt="Profile">
      <span id="profileName" class="profile-name">Profile</span>
    </div>

    <!-- LANG & THEME -->
    <div class="lang-select">
      <div class="selected" onclick="toggleDropdown('lang')">
        <img id="flag" src="https://flagcdn.com/w20/gb.png">
        <span id="langText">English</span>
      </div>
      <div class="options" id="langOptions"></div>
    </div>
    <div class="theme-select">
      <div class="selected" onclick="toggleDropdown('theme')">
        <span id="themeText">🌑 Dark</span>
      </div>
      <div class="options" id="themeOptions"></div>
    </div>
  </div>
</header>

<!-- WAVES -->
<svg class="wave" viewBox="0 0 1440 320">
  <path fill="var(--wave1)" fill-opacity="0.35">
    <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M0,160L60,186C120,210,240,260,360,250C480,240,600,180,720,170C840,160,960,190,1080,200C1200,210,1320,200,1440,190L1440,320L0,320Z; M0,200L60,180C120,160,240,120,360,130C480,140,600,180,720,210C840,240,960,240,1080,210C1200,180,1320,120,1440,90L1440,320L0,320Z; M0,160L60,186C120,210,240,260,360,250C480,240,600,180,720,170C840,160,960,190,1080,200C1200,210,1320,200,1440,190L1440,320L0,320Z"></animate>
  </path>
</svg>
<svg class="wave wave2" viewBox="0 0 1440 320">
  <path fill="var(--wave2)" fill-opacity="0.25">
    <animate attributeName="d" dur="18s" repeatCount="indefinite" values="M0,180L80,200C160,220,320,260,480,250C640,240,800,180,960,170C1120,160,1280,190,1440,210L1440,320L0,320Z; M0,220L80,200C160,180,320,140,480,150C640,160,800,200,960,230C1120,260,1280,260,1440,230L1440,320L0,320Z; M0,180L80,200C160,220,320,260,480,250C640,240,800,180,960,170C1120,160,1280,190,1440,210L1440,320L0,320Z"></animate>
  </path>
</svg>

<!-- MAIN CONTAINER -->
<div class="container">
  <h2 id="title">Welcome Home</h2>
  <p id="subtitle">Enjoy your stay!</p>
  <button class="profileBtn" data-page="pan.html" data-key="aadhar">Aadhar Card</button>
  <button class="profileBtn" data-page="pass.html" data-key="passport">Passport</button>
  <button class="profileBtn" data-page="pancard.html" data-key="pan">Pan Card</button>
</div>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="loader"></div>
</div>

<!-- FOOTER -->
<footer class="page-footer">
  <p>© 2026 Saurabh. All rights reserved.</p>
</footer>

<script>
// ===== PROFILE =====
function goToLogin(){ window.location.href="login.html"; }

// Mock logged-in user
let mockUser = {
  name: "Saurabh",
  img: "https://i.pravatar.cc/24?img=12"
};

document.getElementById("profileName").innerText = mockUser.name;
document.getElementById("profileImg").src = mockUser.img;

// ===== LANGUAGES =====
const languages=[{code:"en",name:"English",flag:"gb"},{code:"hi",name:"Hindi",flag:"in"},{code:"ko",name:"Korean",flag:"kr"},{code:"ja",name:"Japanese",flag:"jp"},{code:"zh",name:"Chinese",flag:"cn"}];
let currentLang=localStorage.getItem("lang")||"en";
const translations={
 en:{title:"Welcome Home",subtitle:"Enjoy your stay!",buttons:{aadhar:"Aadhar Card",passport:"Passport",pan:"Pan Card"}},
 hi:{title:"मुखपृष्ठ में स्वागत है",subtitle:"आनंद लें!",buttons:{aadhar:"आधार कार्ड",passport:"पासपोर्ट",pan:"पैन कार्ड"}}
};
function changeLang(lang){
 const t=translations[lang];
 document.getElementById("title").innerText=t.title;
 document.getElementById("subtitle").innerText=t.subtitle;
 document.querySelectorAll(".profileBtn").forEach(btn=>{ btn.innerText=t.buttons[btn.dataset.key]; });
}
function setLang(code){
 const langObj=languages.find(l=>l.code===code);
 currentLang=code;
 localStorage.setItem("lang",code);
 document.getElementById("flag").src="https://flagcdn.com/w20/"+langObj.flag+".png";
 document.getElementById("langText").innerText=langObj.name;
 changeLang(code);
 renderLangOptions();
 document.getElementById("langOptions").classList.remove("show");
}
function toggleDropdown(type){
 if(type==='theme') document.getElementById('themeOptions').classList.toggle('show');
 if(type==='lang') document.getElementById('langOptions').classList.toggle('show');
}
function renderLangOptions(){
 const container=document.getElementById('langOptions'); container.innerHTML="";
 languages.forEach(lang=>{ if(lang.code!==currentLang){
   const div=document.createElement("div");
   div.innerHTML='<img src="https://flagcdn.com/w20/'+lang.flag+'.png"> '+lang.name;
   div.onclick=()=>{ setLang(lang.code); };
   container.appendChild(div);
 }});
}

// ===== THEME =====
const themes=[
{name:"Dark",icon:"🌑",colors:["#1e1b4b","#4c1d95","#0f172a","#020617"],container:"rgba(255,255,255,0.08)",text:"white",button:"linear-gradient(45deg,#ec4899,#a855f7)",header:"rgba(0,0,0,0.25)",headerText:"white",wave1:"#ec4899",wave2:"#a855f7",accent:"#ec4899"},
{name:"Light",icon:"☀️",colors:["#fefcea","#f1da36","#fff7e6","#fff3c4"],container:"rgba(0,0,0,0.08)",text:"#111",button:"linear-gradient(45deg,#f1da36,#fefcea)",header:"rgba(255,255,255,0.2)",headerText:"#111",wave1:"#f1da36",wave2:"#fefcea",accent:"#f1da36"},
{name:"Sunset",icon:"🌇",colors:["#ff9a9e","#fad0c4","#ffb347","#ffcc70"],container:"rgba(0,0,0,0.15)",text:"#111",button:"linear-gradient(45deg,#ff9a9e,#ffb347)",header:"rgba(0,0,0,0.15)",headerText:"#111",wave1:"#ff9a9e",wave2:"#ffb347",accent:"#ff9a9e"},
{name:"Ocean",icon:"🌊",colors:["#00c6ff","#0072ff","#00f2fe","#009ffd"],container:"rgba(255,255,255,0.15)",text:"#fff",button:"linear-gradient(45deg,#00c6ff,#0072ff)",header:"rgba(0,0,0,0.25)",headerText:"white",wave1:"#00c6ff",wave2:"#0072ff",accent:"#00c6ff"},
{name:"Forest",icon:"🌲",colors:["#134E5E","#71B280","#1f4037","#99A799"],container:"rgba(255,255,255,0.15)",text:"#fff",button:"linear-gradient(45deg,#134E5E,#71B280)",header:"rgba(0,0,0,0.25)",headerText:"white",wave1:"#134E5E",wave2:"#71B280",accent:"#134E5E"}
];
let currentTheme=0;
function setTheme(index){
 const t=themes[index];
 document.documentElement.style.setProperty('--bg-gradient', `linear-gradient(-45deg,${t.colors.join(",")})`);
 document.documentElement.style.setProperty('--container-bg', t.container);
 document.documentElement.style.setProperty('--text-color', t.text);
 document.documentElement.style.setProperty('--button-bg', t.button);
 document.documentElement.style.setProperty('--header-bg', t.header);
 document.documentElement.style.setProperty('--header-text', t.headerText);
 document.documentElement.style.setProperty('--wave1', t.wave1);
 document.documentElement.style.setProperty('--wave2', t.wave2);
 document.documentElement.style.setProperty('--header-accent', t.accent);
 document.getElementById("themeText").innerText = t.icon+" "+t.name;
 renderThemeOptions(); currentTheme=index;
}
function renderThemeOptions(){
 const container=document.getElementById('themeOptions'); container.innerHTML="";
 themes.forEach((t,i)=>{ if(i!==currentTheme){
   const div=document.createElement("div");
   div.innerText=t.icon+" "+t.name;
   div.onclick=()=>{ setTheme(i); document.getElementById('themeOptions').classList.remove('show'); };
   container.appendChild(div);
 }});
}

// ===== INIT =====
window.onload=function(){
 setLang(currentLang);
 setTheme(0);
}

// ===== BUTTON REDIRECT FIX (ADDED) 🔥
document.querySelectorAll(".profileBtn").forEach(button => {
  button.addEventListener("click", function() {
    const page = this.getAttribute("data-page");

    // loader show
    document.getElementById("loadingScreen").style.display = "flex";

    setTimeout(() => {
      window.location.href = page;
    }, 800);
  });
});
</script>
</script>
</body>
</html>
