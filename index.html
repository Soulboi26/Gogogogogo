<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome UI</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  height:100vh;
  background:linear-gradient(-45deg,#1e1b4b,#4c1d95,#0f172a,#020617);
  background-size:400% 400%;
  animation:gradientMove 12s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.wave,.wave2{
  position:absolute;
  bottom:-20px;
  width:100%;
  z-index:0;
  pointer-events:none;
}
.wave2{bottom:-40px;opacity:0.8;}
.wave path{filter:blur(6px);}

.lang-select{
  position:absolute;
  top:20px;
  right:20px;
  z-index:9999;
}

.selected{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,0.08);
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.15);
}

.options{
  margin-top:5px;
  background:rgba(15,23,42,0.95);
  border-radius:10px;
  overflow:hidden;
  display:none;
}

.options div{
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  color:#fff;
}

.options div:hover{
  background:rgba(99,102,241,0.2);
}

.lang-select img{width:20px;}

.container{
  width:360px;
  padding:35px;
  border-radius:22px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(35px);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 20px 80px rgba(0,0,0,0.8);
  color:white;
  position:relative;
  z-index:1;
}

h2{
  text-align:center;
  font-size:28px;
  background:linear-gradient(45deg,#ec4899,#a855f7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

p{text-align:center;margin-bottom:25px;color:#94a3b8;}

.btn-group{display:flex;flex-direction:column;gap:15px;}

button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:linear-gradient(45deg,#ec4899,#a855f7);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{transform:scale(1.05);}

.divider{text-align:center;margin:20px 0;color:#64748b;font-size:13px;}

.social{display:flex;gap:10px;}
.social button{flex:1;background:rgba(255,255,255,0.05);}
</style>
</head>

<body>

<!-- Waves -->
<svg class="wave" viewBox="0 0 1440 320">
<path fill="#ec4899" fill-opacity="0.35">
<animate attributeName="d" dur="12s" repeatCount="indefinite"
values="M0,160L60,186C120,210,240,260,360,250C480,240,600,180,720,170C840,160,960,190,1080,200C1200,210,1320,200,1440,190L1440,320L0,320Z;
M0,200L60,180C120,160,240,120,360,130C480,140,600,180,720,210C840,240,960,240,1080,210C1200,180,1320,120,1440,90L1440,320L0,320Z;
M0,160L60,186C120,210,240,260,360,250C480,240,600,180,720,170C840,160,960,190,1080,200C1200,210,1320,200,1440,190L1440,320L0,320Z">
</animate>
</path>
</svg>

<svg class="wave wave2" viewBox="0 0 1440 320">
<path fill="#a855f7" fill-opacity="0.25">
<animate attributeName="d" dur="18s" repeatCount="indefinite"
values="M0,180L80,200C160,220,320,260,480,250C640,240,800,180,960,170C1120,160,1280,190,1440,210L1440,320L0,320Z;
M0,220L80,200C160,180,320,140,480,150C640,160,800,200,960,230C1120,260,1280,260,1440,230L1440,320L0,320Z;
M0,180L80,200C160,220,320,260,480,250C640,240,800,180,960,170C1120,160,1280,190,1440,210L1440,320L0,320Z">
</animate>
</path>
</svg>

<!-- Language -->
<div class="lang-select">
  <div class="selected" onclick="toggleDropdown()">
    <img id="flag" src="https://flagcdn.com/w20/gb.png">
    <span id="langText">English</span>
  </div>
  <div class="options" id="options"></div>
</div>

<div class="container">
  <h2 id="title">Welcome</h2>
  <p id="subtitle">Continue</p>

  <div class="btn-group">
    <button id="signinBtn">Login In</button>
    <button id="signupBtn">Sign Up</button>
  </div>

  <div class="divider" id="divider">or continue with</div>
<div class="social">
    <button id="googleBtn"><i class="fab fa-google"></i></button>
    <button id="facebookBtn"><i class="fab fa-facebook"></i></button>
    <button id="twitterBtn"><i class="fab fa-twitter"></i></button>
  </div>
</div>

<script>
// 🔹 Redirect buttons
document.getElementById("signinBtn").addEventListener("click", () => {
  window.location.href = "Login.html";
});

document.getElementById("signupBtn").addEventListener("click", () => {
  window.location.href = "register.html";
});

// 🔹 Social login redirect
document.getElementById("googleBtn").addEventListener("click", () => {
  window.location.href = "https://accounts.google.com/signin";
});

document.getElementById("facebookBtn").addEventListener("click", () => {
  window.location.href = "https://www.facebook.com/login";
});

document.getElementById("twitterBtn").addEventListener("click", () => {
  window.location.href = "https://twitter.com/login";
});

// 🔹 Language system (same as before)
const languages=[
{code:"en",name:"English",flag:"gb"},
{code:"hi",name:"Hindi",flag:"in"},
{code:"ko",name:"Korean",flag:"kr"},
{code:"ja",name:"Japanese",flag:"jp"},
{code:"zh",name:"Chinese",flag:"cn"}
];

let currentLang=localStorage.getItem("lang")||"en";

const translations={
en:{title:"Welcome",subtitle:"Continue",signin:"Sign In",signup:"Sign Up",divider:"or continue with"},
hi:{title:"स्वागत है",subtitle:"जारी रखें",signin:"साइन इन",signup:"साइन अप",divider:"या जारी रखें"},
ko:{title:"환영합니다",subtitle:"계속",signin:"로그인",signup:"가입",divider:"또는 계속"},
ja:{title:"ようこそ",subtitle:"続行",signin:"サインイン",signup:"サインアップ",divider:"または続行"},
zh:{title:"欢迎",subtitle:"继续",signin:"登录",signup:"注册",divider:"或继续使用"}
};

function changeLang(lang){
const t=translations[lang];
document.getElementById("title").innerText=t.title;
document.getElementById("subtitle").innerText=t.subtitle;
document.getElementById("signinBtn").innerText=t.signin;
document.getElementById("signupBtn").innerText=t.signup;
document.getElementById("divider").innerText=t.divider;
}

function toggleDropdown(){
let opt=document.getElementById("options");
opt.style.display=opt.style.display==="block"?"none":"block";
}

function setLang(code){
const langObj=languages.find(l=>l.code===code);

currentLang=code;
localStorage.setItem("lang",code);

document.getElementById("flag").src="https://flagcdn.com/w20/"+langObj.flag+".png";
document.getElementById("langText").innerText=langObj.name;

changeLang(code);
renderOptions();

document.getElementById("options").style.display="none";
}

function renderOptions(){
let container=document.getElementById("options");
container.innerHTML="";

languages.forEach(lang=>{
if(lang.code!==currentLang){
const div=document.createElement("div");

div.innerHTML='<img src="https://flagcdn.com/w20/'+lang.flag+'.png"> '+lang.name;

div.addEventListener("click",(e)=>{
e.stopPropagation();
setLang(lang.code);
});

container.appendChild(div);
}
});
}

window.onload=()=>{
setLang(currentLang);
};

document.addEventListener("click",(e)=>{
const box=document.querySelector(".lang-select");
if(!box.contains(e.target)){
document.getElementById("options").style.display="none";
}
});
</script>

</body>
</html>
