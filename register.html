<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register Page</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{height:100vh;background:linear-gradient(-45deg,#1e1b4b,#4c1d95,#0f172a,#020617);background-size:400% 400%;animation:gradientMove 25s ease infinite;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;}
@keyframes gradientMove{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

/* Waves */
.wave{position:absolute;bottom:-20px;left:0;width:100%;z-index:0;will-change:transform;}
.wave2{bottom:-40px;opacity:0.8;}
.wave path{filter: blur(6px);}

/* Language */
.lang-select{position:absolute;top:20px;right:20px;z-index:2;}
.selected{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);color:#fff;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:bold;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);}
.options{margin-top:5px;background:rgba(15,23,42,0.95);border-radius:10px;overflow:hidden;display:none;}
.options div{padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;color:#fff;}
.options div:hover{background:rgba(99,102,241,0.2);}
.lang-select img{width:20px;}

/* Card */
.container{width:360px;padding:40px 35px;border-radius:22px;background:rgba(255,255,255,0.05);backdrop-filter:blur(35px);border:1px solid rgba(255,255,255,0.12);box-shadow:0 20px 80px rgba(0,0,0,0.8);color:white;position:relative;z-index:1;}
.container h2{text-align:center;font-size:28px;background:linear-gradient(45deg,#ec4899,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.container p{text-align:center;font-size:14px;color:#94a3b8;margin-bottom:25px;}

/* Input */
.input-box{position:relative;margin-bottom:18px;}
.input-box i{position:absolute;top:50%;left:12px;transform:translateY(-50%);color:#ec4899;}
.input-box input{width:100%;padding:12px 12px 12px 38px;border-radius:10px;border:none;outline:none;background:rgba(255,255,255,0.06);color:white;}
.input-box input:focus{box-shadow:0 0 15px rgba(236,72,153,0.6);}

/* Options */
.options-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:15px;}

/* Button */
button{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(45deg,#ec4899,#a855f7);color:white;font-weight:bold;cursor:pointer;transition:transform 0.2s;}
button:hover{transform:scale(1.05);}

/* Links */
.options-row a,.footer a{color:#ec4899;cursor:pointer;}

/* Divider */
.divider{text-align:center;margin:20px 0;font-size:13px;color:#64748b;}

/* Social */
.social{display:flex;gap:10px;margin-top:15px;}
.social button{flex:1;background: rgba(255,255,255,0.05);color: white;border-radius: 10px;font-size: 18px;transition: transform 0.2s ease, background 0.2s ease;display:flex;align-items:center;justify-content:center;}
.social button:hover{transform: scale(1.05);background: rgba(236,72,153,0.15);}

/* Footer */
.footer{text-align:center;margin-top:15px;font-size:13px;}

/* LOADING */
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(2,6,23,0.7);backdrop-filter:blur(10px);display:none;justify-content:center;align-items:center;z-index:999;}
.loading-card{padding:30px 40px;border-radius:20px;background:rgba(255,255,255,0.05);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.1);text-align:center;color:white;}
.spinner{width:50px;height:50px;border:5px solid rgba(236,72,153,0.2);border-top:5px solid #ec4899;border-radius:50%;animation:spin 1s linear infinite;margin:auto;}
@keyframes spin{100%{transform:rotate(360deg);}}

/* SUCCESS */
.success-overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:none;justify-content:center;align-items:center;backdrop-filter:blur(10px);z-index:1000;}
.success-card{padding:30px 40px;border-radius:20px;background:rgba(255,255,255,0.05);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.1);text-align:center;color:white;animation:pop 0.4s ease;}
@keyframes pop{0%{transform:scale(0.7);opacity:0;}100%{transform:scale(1);opacity:1;}}
.checkmark{width:70px;height:70px;border-radius:50%;border:3px solid #22c55e;position:relative;margin:auto;margin-bottom:15px;animation:scaleIn 0.4s ease;}
@keyframes scaleIn{0%{transform:scale(0.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
.checkmark::after{content:'';position:absolute;left:22px;top:15px;width:14px;height:28px;border-right:4px solid #22c55e;border-bottom:4px solid #22c55e;transform:rotate(45deg) scale(0);transform-origin:center;animation:drawTick 0.4s ease forwards;animation-delay:0.2s;}
@keyframes drawTick{to{transform:rotate(45deg) scale(1);}}

/* Floating Help Widget */
#helpWidget{position:fixed;right:20px;bottom:20px;z-index:9999;font-family:'Poppins',sans-serif;}
#helpBtn{background:#ec4899;color:white;padding:14px;border-radius:50%;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);transition:transform 0.2s;font-size:20px;display:flex;align-items:center;justify-content:center;}
#helpBtn:hover{transform:scale(1.1);}
#chatBox{display:none;position:absolute;bottom:60px;right:0;width:300px;max-height:400px;background:rgba(0,0,0,0.85);backdrop-filter:blur(15px);border-radius:12px;overflow:hidden;flex-direction:column;border:1px solid rgba(255,255,255,0.1);}
#chatHeader{background:linear-gradient(45deg,#ec4899,#a855f7);padding:10px;text-align:center;font-weight:bold;color:white;}
#chatMessages{flex:1;padding:10px;overflow-y:auto;font-size:14px;}
.botMsg,.userMsg{padding:6px 10px;margin:5px 0;border-radius:10px;max-width:80%;}
.botMsg{background:rgba(236,72,153,0.2);color:white;}
.userMsg{background:rgba(168,85,247,0.3);color:white;margin-left:auto;}
#chatInput{border:none;outline:none;padding:10px;width:100%;box-sizing:border-box;background:rgba(255,255,255,0.05);color:white;}
</style>
</head>
<body>

<!-- Waves -->
<svg class="wave" viewBox="0 0 1440 320"><path fill="#ec4899" fill-opacity="0.35"><animate attributeName="d" dur="12s" repeatCount="indefinite" values="M0,160L60,186C120,210,240,260,360,250C480,240,600,180,720,170C840,160,960,190,1080,200C1200,210,1320,200,1440,190L1440,320L0,320Z; M0,200L60,180C120,160,240,120,360,130C480,140,600,180,720,210C840,240,960,240,1080,210C1200,180,1320,120,1440,90L1440,320L0,320Z; M0,160L60,186C120,210,240,260,360,250C480,240,600,180,720,170C840,160,960,190,1080,200C1200,210,1320,200,1440,190L1440,320L0,320Z"></animate></path></svg>
<svg class="wave wave2" viewBox="0 0 1440 320"><path fill="#a855f7" fill-opacity="0.25"><animate attributeName="d" dur="18s" repeatCount="indefinite" values="M0,180L80,200C160,220,320,260,480,250C640,240,800,180,960,170C1120,160,1280,190,1440,210L1440,320L0,320Z; M0,220L80,200C160,180,320,140,480,150C640,160,800,200,960,230C1120,260,1280,260,1440,230L1440,320L0,320Z; M0,180L80,200C160,220,320,260,480,250C640,240,800,180,960,170C1120,160,1280,190,1440,210L1440,320L0,320Z"></animate></path></svg>

<!-- Language -->
<div class="lang-select">
  <div class="selected" onclick="toggleDropdown()">
    <img id="flag" src="https://flagcdn.com/w20/gb.png">
    <span id="langText">English</span>
  </div>
  <div class="options" id="options"></div>
</div>

<div class="container">
  <h2 id="title">Create Account</h2>
  <p id="subtitle">Sign up to get started</p>

  <form action="register.php" method="POST">

  <div class="input-box">
    <i class="fa fa-user"></i>
    <input type="text" name="username" placeholder="Username" required>
  </div>

  <div class="input-box">
    <i class="fa fa-envelope"></i>
    <input type="email" name="email" placeholder="Email" required>
  </div>

  <div class="input-box">
    <i class="fa fa-lock"></i>
    <input type="password" name="password" placeholder="Password" required>
  </div>

  <div class="options-row">
    <label id="remember"><input type="checkbox"> I agree to terms</label>
  </div>

  <button type="submit" id="registerBtn">Sign Up</button>

</form>

  <div class="divider" id="divider">or continue with</div>

  <!-- SOCIAL BUTTONS -->
  <div class="social">
    <button onclick="socialLogin('Google')"><i class="fab fa-google"></i></button>
    <button onclick="socialLogin('Facebook')"><i class="fab fa-facebook"></i></button>
    <button onclick="socialLogin('Twitter')"><i class="fab fa-twitter"></i></button>
  </div>

  <div class="footer" id="footer">
    Already have an account? <a href="Login.html">Login</a>
  </div>
</div>

<!-- LOADING -->
<div id="loadingBox" class="loading-overlay">
  <div class="loading-card">
    <div class="spinner"></div>
    <p id="loadingText">Signing up...</p>
  </div>
</div>

<!-- SUCCESS -->
<div id="successBox" class="success-overlay">
  <div class="success-card">
    <div class="checkmark"></div>
    <p>Registration Successful</p>
  </div>
</div>

<!-- CHAT WIDGET -->
<div id="helpWidget">
  <div id="helpBtn">💬</div>
  <div id="chatBox">
    <div id="chatHeader">Support</div>
    <div id="chatMessages">
      <div class="botMsg">Hello! How can I help you today?</div>
    </div>
    <input type="text" id="chatInput" placeholder="Type your message...">
  </div>
</div>

<script>
// ===== LANGUAGE =====
const languages=[{code:"en",name:"English",flag:"gb"},{code:"hi",name:"Hindi",flag:"in"},{code:"ko",name:"Korean",flag:"kr"},{code:"ja",name:"Japanese",flag:"jp"},{code:"zh",name:"Chinese",flag:"cn"}];
let currentLang=localStorage.getItem("lang")||"en";
const translations = {
  en: { title:"Create Account", subtitle:"Sign up to get started", username:"Username", email:"Email", password:"Password", remember:"I agree to terms", signup:"Sign Up", divider:"or continue with", login:"Login", footer:"Already have an account? Login" },
  hi: { title:"खाता बनाएं", subtitle:"शुरू करने के लिए साइन अप करें", username:"उपयोगकर्ता नाम", email:"ईमेल", password:"पासवर्ड", remember:"मैं शर्तों से सहमत हूँ", signup:"साइन अप करें", divider:"या जारी रखें", login:"लॉगिन", footer:"पहले से खाता है? लॉगिन करें" },
  ko: { title:"계정 만들기", subtitle:"시작하려면 가입하세요", username:"사용자 이름", email:"이메일", password:"비밀번호", remember:"약관에 동의합니다", signup:"가입", divider:"또는 계속", login:"로그인", footer:"이미 계정이 있나요? 로그인" },
  ja: { title:"アカウント作成", subtitle:"始めるにはサインアップしてください", username:"ユーザー名", email:"メール", password:"パスワード", remember:"利用規約に同意します", signup:"サインアップ", divider:"または続行", login:"ログイン", footer:"すでにアカウントをお持ちですか？ログイン" },
  zh: { title:"创建账户", subtitle:"注册开始使用", username:"用户名", email:"电子邮件", password:"密码", remember:"我同意条款", signup:"注册", divider:"或继续使用", login:"登录", footer:"已有账户？登录" }
};
function changeLang(lang){
  document.getElementById("title").innerText = translations[lang].title;
  document.getElementById("subtitle").innerText = translations[lang].subtitle;
  document.getElementById("username").placeholder = translations[lang].username;
  document.getElementById("email").placeholder = translations[lang].email;
  document.getElementById("password").placeholder = translations[lang].password;
  document.getElementById("remember").innerHTML = `<input type="checkbox"> ${translations[lang].remember}`;
  document.getElementById("registerBtn").innerText = translations[lang].signup;
  document.getElementById("divider").innerText = translations[lang].divider;
  const footer = document.getElementById("footer");
  footer.innerHTML='';
  const textNode=document.createTextNode((translations[lang].footer).split(translations[lang].login)[0]);
  const link=document.createElement('a'); link.href="login.html"; link.innerText=translations[lang].login;
  footer.appendChild(textNode); footer.appendChild(link);
}
function toggleDropdown(){
  const opt=document.getElementById("options");
  opt.style.display=opt.style.display==="block"?"none":"block";
  if(opt.innerHTML===""){
    languages.forEach(lang=>{
      const div=document.createElement("div");
      div.innerHTML=`<img src="https://flagcdn.com/w20/${lang.flag}.png"> ${lang.name}`;
      div.onclick=()=>{currentLang=lang.code; localStorage.setItem("lang",currentLang); document.getElementById("flag").src=`https://flagcdn.com/w20/${lang.flag}.png`; document.getElementById("langText").innerText=lang.name; changeLang(lang.code); opt.style.display="none";};
      opt.appendChild(div);
    });
  }
}
changeLang(currentLang);

// ===== REGISTER =====
const registerBtn=document.getElementById("registerBtn");
const loadingBox=document.getElementById("loadingBox");
const successBox=document.getElementById("successBox");

registerBtn.addEventListener("click",()=>{
  loadingBox.style.display="flex";
  setTimeout(()=>{
    loadingBox.style.display="none";
    successBox.style.display="flex";
    setTimeout(()=>{ successBox.style.display="none"; window.location.href="login.html"; },1500);
  },2000);
});

// ===== SOCIAL LOGIN =====
function socialLogin(platform){
  loadingBox.style.display="flex";
  document.getElementById("loadingText").innerText=`Signing in with ${platform}...`;
  setTimeout(()=>{
    loadingBox.style.display="none";
    successBox.querySelector("p").innerText=`Logged in with ${platform} successfully!`;
    successBox.style.display="flex";
    setTimeout(()=>{ successBox.style.display="none"; window.location.href="login.html"; },1500);
  },2000);
}

// ===== CHAT WIDGET =====
const helpBtn=document.getElementById("helpBtn");
const chatBox=document.getElementById("chatBox");
const chatInput=document.getElementById("chatInput");
const chatMessages=document.getElementById("chatMessages");

helpBtn.addEventListener("click",()=>{chatBox.style.display=chatBox.style.display==="flex"?"none":"flex";});
chatInput.addEventListener("keypress",(e)=>{
  if(e.key==="Enter" && chatInput.value.trim()!==""){
    const userMsg=document.createElement("div"); userMsg.className="userMsg"; userMsg.innerText=chatInput.value;
    chatMessages.appendChild(userMsg);
    chatMessages.scrollTop=chatMessages.scrollHeight;
    const botMsg=document.createElement("div"); botMsg.className="botMsg"; botMsg.innerText="Processing..."; chatMessages.appendChild(botMsg);
    chatInput.value="";
    setTimeout(()=>{ botMsg.innerText="Hello! How can I assist you?"; chatMessages.scrollTop=chatMessages.scrollHeight; },1000);
  }
});
</script>
</body>
</html>
